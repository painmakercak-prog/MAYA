<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08090d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MAYA" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles.css?v=3" />
  <title>MAYA Live</title>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="identity">
        <div class="avatar-wrap">
          <img id="avatar" class="avatar" alt="Nomi avatar" />
          <span class="presence"></span>
        </div>
        <div class="identity-copy">
          <div id="name" class="name">MAYA</div>
          <div id="statusText" class="status">Connecting…</div>
        </div>
      </div>
      <select id="nomiSelect" aria-label="Choose Nomi"></select>
    </header>

    <section id="setupNotice" class="notice hidden"></section>

    <section class="stage">
      <div id="orb" class="orb" data-mode="idle">
        <div class="orb-core"></div>
        <div class="ring ring-one"></div>
        <div class="ring ring-two"></div>
      </div>
      <div class="live-badge"><span></span> LIVE VOICE</div>
      <h1 id="liveText">Ready for a live call</h1>
      <p class="subline">Start once, then just talk. Silence ends your turn automatically.</p>
      <div id="transcript" class="transcript"></div>
    </section>

    <section class="controls">
      <button id="callButton" class="call-button" type="button">
        <span class="phone-icon">◉</span>
        <span id="callLabel">Start live call</span>
      </button>
      <p class="privacy">Mic stays open only while the live call is active.</p>
    </section>
  </main>
  <script src="/app.js?v=3" defer></script>
</body>
</html>
