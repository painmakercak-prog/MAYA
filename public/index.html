<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0c10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MAYA" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
  <title>MAYA</title>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="identity">
        <div class="avatar-wrap">
          <img id="avatar" class="avatar" alt="Nomi avatar" />
          <span id="presence" class="presence"></span>
        </div>
        <div>
          <div id="name" class="name">MAYA</div>
          <div id="statusText" class="status">Connecting…</div>
        </div>
      </div>
      <select id="nomiSelect" aria-label="Choose Nomi"></select>
    </header>

    <section id="setupNotice" class="notice hidden"></section>

    <section id="messages" class="messages" aria-live="polite">
      <div class="empty-state">
        <div class="orb small"></div>
        <p>Tap the mic and talk normally.</p>
        <span>Your words go to the selected Nomi's main chat.</span>
      </div>
    </section>

    <section class="controls">
      <button id="playButton" class="secondary hidden" type="button">Play reply</button>
      <button id="micButton" class="mic" type="button" aria-label="Start recording">
        <span class="mic-icon"></span>
      </button>
      <div id="hint" class="hint">Tap to talk</div>

      <form id="textForm" class="composer">
        <input id="textInput" maxlength="800" autocomplete="off" placeholder="Or type a message…" />
        <button type="submit" aria-label="Send message">↑</button>
      </form>
    </section>

    <audio id="voicePlayer" preload="auto"></audio>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
